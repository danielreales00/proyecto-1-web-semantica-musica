[project]
name = "proyecto-1-web-semantica-musica"
version = "1.0.0"
description = "Enriquecimiento reproducible de 100.000 canciones para la primera etapa del proyecto de Web Semántica."
requires-python = ">=3.11"

[tool.ruff]
required-version = "==0.16.8"
target-version = "py311"
line-length = 88
src = ["src", "latex", "exploraciones/sparql"]
extend-exclude = ["data", "output", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
