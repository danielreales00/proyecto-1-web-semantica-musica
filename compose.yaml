name: musica-etapa2
services:
  fuseki:
    build: ./docker/fuseki
    command: ["--conf", "/fuseki/config.ttl"]
    ports:
      - "127.0.0.1:${FUSEKI_PORT:-3030}:3030"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx2g"
    volumes:
      - fuseki-data:/fuseki/databases
      - ./docker/fuseki/config.ttl:/fuseki/config.ttl:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3030"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
volumes:
  fuseki-data:
